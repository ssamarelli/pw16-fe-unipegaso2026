<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>medAPP - Calendar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background:#F4F7FE;">
    <div class="flex h-screen">

        <!-- Sidebar -->
        <nav class="sidebar">
            <a href="index.html" class="sidebar-logo" title="medAPP">M</a>
            <a href="index.html" class="sidebar-btn" title="Home"><i class="fas fa-home text-xl"></i></a>
            <a href="calendar.html" class="sidebar-btn active" title="Calendar"><i class="fas fa-calendar-alt text-xl"></i></a>
            <a href="users.html" class="sidebar-btn" title="Users"><i class="fas fa-users text-xl"></i></a>
        </nav>

        <!-- Main content -->
        <div class="flex-1 p-8 flex flex-col overflow-hidden">
            <div class="flex justify-between items-center mb-8 flex-shrink-0">
                <div>
                    <h1 class="text-3xl font-bold text-slate-800">Calendar</h1>
                    <p class="text-slate-400 text-sm mt-1">Schedule and manage appointments</p>
                </div>
                <button id="newAppointmentBtn" class="btn-primary">
                    <i class="fas fa-plus"></i> New Appointment
                </button>
            </div>
            <div id="calendar" class="flex-1 min-h-0" style="background:#fff; border-radius:20px; box-shadow:0 8px 30px rgba(0,0,0,0.05); padding:1.5rem; overflow:hidden;"></div>
        </div>
    </div>

    <!-- Appointment Modal -->
    <div id="appointmentModal" class="modal hidden fixed inset-0 flex items-center justify-center z-50" style="background:rgba(15,23,42,0.45);">
        <div class="modal-box" style="max-width:460px; width:100%;">
            <!-- Header -->
            <div class="flex justify-between items-center mb-5">
                <h2 id="appointmentModalTitle" class="text-xl font-bold text-slate-800">Appointment</h2>
                <div class="flex gap-2 items-center">
                    <button id="appointmentEditBtn" class="hidden w-9 h-9 flex items-center justify-center rounded-full hover:bg-slate-100 text-slate-400 hover:text-blue-500 transition-all">
                        <i class="fas fa-edit"></i>
                    </button>
                    <button class="close-modal w-9 h-9 flex items-center justify-center rounded-full hover:bg-slate-100 text-slate-400 hover:text-slate-600 transition-all">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>

            <form id="appointmentForm" class="space-y-4">
                <input type="hidden" id="appointmentId">

                <!-- Appointment ID (read-only, edit mode only) -->
                <div id="appointmentIdDisplay" class="hidden">
                    <label class="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wide">Appointment ID</label>
                    <input type="text" id="appointmentIdReadonly" readonly>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wide">Date</label>
                        <input type="date" id="appointmentDate" required>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wide">Time</label>
                        <input type="time" id="appointmentTime" required>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wide">Patient</label>
                    <select id="appointmentPatient" required></select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wide">Doctor</label>
                    <select id="appointmentDoctor" required></select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wide">Type</label>
                    <select id="appointmentType" required>
                        <option value="CONSULTATION">Consultation</option>
                        <option value="CHECKUP">Checkup</option>
                        <option value="SURGERY">Surgery</option>
                        <option value="FOLLOW_UP">Follow-up</option>
                    </select>
                </div>

                <div class="flex gap-3 pt-2">
                    <button type="submit" id="appointmentConfirmBtn" class="btn-primary hidden flex-1" style="justify-content:center;">
                        <i class="fas fa-check"></i> Confirm
                    </button>
                    <button type="button" id="cancelAppointmentBtn" class="btn-danger hidden flex-1">
                        <i class="fas fa-ban"></i> Cancel
                    </button>
                    <button type="button" class="close-modal btn-secondary flex-1">Close</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Appointment Popup -->
    <div id="aptPopup" class="apt-popup hidden">
        <div class="apt-popup-header">
            <span id="aptPopupId" class="apt-popup-id"></span>
            <button id="aptPopupClose" class="apt-popup-close"><i class="fas fa-times"></i></button>
        </div>
        <div class="apt-popup-row">
            <i class="fas fa-user apt-popup-icon"></i>
            <span id="aptPopupPatient"></span>
        </div>
        <div class="apt-popup-row">
            <i class="fas fa-user-md apt-popup-icon"></i>
            <span id="aptPopupDoctor"></span>
        </div>
        <div class="apt-popup-row">
            <i class="fas fa-calendar apt-popup-icon"></i>
            <span id="aptPopupDate"></span>
        </div>
        <div class="apt-popup-row">
            <i class="fas fa-clock apt-popup-icon"></i>
            <span id="aptPopupTime"></span>
        </div>
        <div class="apt-popup-row">
            <i class="fas fa-stethoscope apt-popup-icon"></i>
            <span id="aptPopupType"></span>
        </div>
        <div class="apt-popup-row">
            <i class="fas fa-circle apt-popup-icon"></i>
            <span id="aptPopupStatus"></span>
        </div>
        <div class="apt-popup-footer">
            <button id="aptPopupEditBtn" class="btn-primary" style="width:100%;justify-content:center;font-size:0.8rem;padding:0.5rem 1rem;">
                <i class="fas fa-edit"></i> Edit Appointment
            </button>
        </div>
    </div>

    <script src="shared.js"></script>
    <script src="calendar.js"></script>
</body>
</html>
